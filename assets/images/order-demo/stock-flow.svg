<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">库存的三次搬家</title>
  <desc id="desc">下单时可用库存变成待处理库存，支付时待处理库存变成已售，取消或超时时待处理库存回到可用。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#69716f"/></marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a08a6a"/></marker>
  </defs>
  <rect width="760" height="420" rx="8" fill="#f8faf9"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#202924" text-anchor="middle">
    <text x="380" y="46" font-size="25" font-weight="650">一个 SKU 的库存，被拆成三份</text>

    <rect x="34" y="110" width="200" height="96" rx="5" fill="#e4eee7" stroke="#afc9b9"/>
    <text x="134" y="152" font-size="23">可用</text>
    <text x="134" y="182" font-size="19" fill="#53615a">available</text>

    <rect x="280" y="110" width="200" height="96" rx="5" fill="#e5edf4" stroke="#b1c4d5"/>
    <text x="380" y="152" font-size="23">待处理</text>
    <text x="380" y="182" font-size="19" fill="#53615a">locked</text>

    <rect x="526" y="110" width="200" height="96" rx="5" fill="#f1eaf2" stroke="#cbb9ce"/>
    <text x="626" y="152" font-size="23">已售</text>
    <text x="626" y="182" font-size="19" fill="#53615a">sold</text>

    <path d="M236 140H274" stroke="#69716f" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="255" y="126" font-size="18" fill="#53615a">下单</text>

    <path d="M482 140H520" stroke="#69716f" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="501" y="126" font-size="18" fill="#53615a">支付</text>

    <path d="M380 208V300H134V214" fill="none" stroke="#a08a6a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>
    <text x="257" y="326" font-size="18" fill="#8a7355">取消 / 超时未支付</text>

    <text x="380" y="382" font-size="20" fill="#53615a">任何时刻：可用 + 待处理 + 已售 = 期初库存</text>
  </g>
</svg>
